name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [ "master" ]
  # Callable so sync-docs.yml can deploy the commit it just pushed. A push made
  # with GITHUB_TOKEN does not trigger workflows, so the sync has to ask.
  workflow_call:
    inputs:
      ref:
        description: 'Commit or branch to deploy. Empty means the triggering ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build Docusaurus
        run: npm run build
        env:
          # Repository variable. Unset means the page counter stays inert, which
          # is the correct state until the worker in analytics/ is deployed.
          ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build   # Docusaurus outputs to ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
