name: Deploy Docusaurus to Cloudflare Pages

on:
  push:
    branches: [ "master" ]
  # Rebuild without a commit — needed after changing a repository variable such
  # as ANALYTICS_ENDPOINT, which only reaches the site at build time.
  workflow_dispatch:
  # Callable so sync-docs.yml can deploy the commit it just pushed. A push made
  # with GITHUB_TOKEN does not trigger workflows, so the sync has to ask.
  workflow_call:
    inputs:
      ref:
        description: 'Commit or branch to deploy. Empty means the triggering ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Fails when an English page or interface string was changed without
      # running `npm run translate`, which would otherwise deploy a Russian URL
      # serving English text — silently, and for as long as nobody looked.
      # Hash comparison only: no Claude CLI, no network, no tokens.
      - name: Check the Russian translation is current
        run: npm run translate -- --check

      - name: Build Docusaurus
        run: npm run build
        env:
          # Repository variable. Unset means the page counter stays inert, which
          # is the correct state until the worker in analytics/ is deployed.
          ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build   # Docusaurus outputs to ./build

  # Hosting is Cloudflare Pages (GitHub Pages stopped issuing HTTPS certificates
  # for our domains, 18.10.2026). The build artifact keeps the upload-pages-artifact
  # format: one tar named github-pages.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir site && tar -xf artifact.tar -C site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=dartway-dev --branch=master
