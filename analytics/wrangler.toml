name = "dartway-analytics"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
# `binding` is the name the database has *in the code* — worker.js reaches it as
# `env.DB`, so this stays "DB". `wrangler d1 create` suggests a binding derived
# from the database name instead; take only the database_id from its output.
binding = "DB"
database_name = "dartway-analytics"
database_id = "ef86bc92-6d3f-4169-998f-81eac7085d0a"

[vars]
# Comma-separated. The first one is also the fallback CORS origin.
#
# This list is also what tells sites apart: an accepted event is filed under the
# host of its Origin. Adding a site is one entry here — e.g.
# "https://dartway.dev,https://dartway.studio" — and nothing else.
ALLOWED_ORIGINS = "https://dartway.dev"

# STATS_TOKEN is a secret, not a var:
#   wrangler secret put STATS_TOKEN
